<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4x4 盤面ゲーム</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="game-container">
    
    <!-- 画面左：プレイヤー1情報 -->
    <div id="p1-card" class="player-card">
      <h2>プレイヤー 1</h2>
      <div class="status-badge">1P</div>
      <div class="life-container">ライフ: <span id="p1-life">♥♥♥</span></div>
    </div>

    <!-- 画面中央：状態表示と盤面 -->
    <div class="center-area">
      <div id="status-message">「スタート」を押して開始</div>
      
      <!-- スタートボタン -->
      <button id="start-btn">ゲームスタート</button>
      
      
      <div id="board"></div>
      <!-- リセットボタン -->
      <button id="reset-btn" class="hidden">リセット</button>
    </div>

    <!-- 画面右：プレイヤー2情報 -->
    <div id="p2-card" class="player-card">
      <h2>プレイヤー 2</h2>
      <div class="status-badge">2P</div>
      <div class="life-container">ライフ: <span id="p2-life">♥♥♥</span></div>
    </div>

  </div>

  <script src="index.js"></script>
</body>
</html>
